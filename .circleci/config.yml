version: 2.1

filters_always: &filters_always
  filters:
    tags:
      only: /.*/

orbs:
  macos: circleci/macos@2
  bats: circleci/bats@1.0.0

jobs:
  lint:
    macos:
      xcode: "26.6"
    resource_class: m4pro.medium

    steps:
      - checkout
      - run: make lint

  build:
    parameters:
      destination:
        type: string
      xcode_version:
        type: string
    macos:
      xcode: << parameters.xcode_version >>
    resource_class: m4pro.medium
    steps:
      - checkout
      - run: xcodebuild -version
      - run: xcodebuild -scheme honeycomb-opentelemetry-swift -destination << parameters.destination >>

  ios_tests:
    parameters:
      xcode_version:
        type: string
      ios_version:
        type: string
      simulator_device:
        type: string
    macos:
      xcode: << parameters.xcode_version >>
    resource_class: m4pro.medium

    steps:
      - macos/preboot-simulator:
          version: << parameters.ios_version >>
          platform: "iOS"
          device: << parameters.simulator_device >>
      - checkout
      - run: xcodebuild -version
      - run:
          name: Available runtimes and destinations
          command: |
            xcrun simctl list runtimes
            xcodebuild -scheme HoneycombTests -showdestinations
      - run:
          name: Run unit tests
          command: |
            xcodebuild test -scheme HoneycombTests \
              -destination 'platform=iOS Simulator,OS=<< parameters.ios_version >>,name=<< parameters.simulator_device >>'

  ios_smoke_tests:
    parameters:
      otel_version:
        type: string
      xcode_version:
        type: string
      ios_version:
        type: string
      simulator_device:
        type: string
    macos:
      xcode: << parameters.xcode_version >>
    resource_class: m4pro.medium

    steps:
      - attach_workspace:
          at: ./
      - macos/preboot-simulator:
          version: << parameters.ios_version >>
          platform: "iOS"
          device: << parameters.simulator_device >>
      - checkout
      - bats/install
      - run:
          name: What's the BATS?
          command: |
            which bats
            bats --version
      - run: xcodebuild -version
      - run:
          name: Available runtimes and destinations
          command: |
            xcrun simctl list runtimes
            xcodebuild -scheme HoneycombTests -showdestinations
      - run:
          name: Install OTel Collector
          environment:
            COLLECTOR_VERSION: "0.111.0"
          command: |
            curl --proto '=https' --tlsv1.2 -fOL https://github.com/open-telemetry/opentelemetry-collector-releases/releases/download/v${COLLECTOR_VERSION}/otelcol_${COLLECTOR_VERSION}_darwin_arm64.tar.gz
            tar -xvf otelcol_${COLLECTOR_VERSION}_darwin_arm64.tar.gz
      - run:
          name: Start OTel Collector
          command: touch ./smoke-tests/collector/data.json && ./otelcol --config=./smoke-tests/collector/otel-collector-config.yaml --set="exporters::file::path=./smoke-tests/collector/data.json"
          background: true
      - run:
          name: Start Mock Server
          working_directory: smoke-tests/mock-server
          command: npm install && npm start
          background: true
      - run:
          name: Set opentelemetry-swift version
          command: ./set-otel-version.sh << parameters.otel_version >>
      - run:
          name: Run iOS App
          command: |
            SMOKE_TEST_DESTINATION='platform=iOS Simulator,OS=<< parameters.ios_version >>,name=<< parameters.simulator_device >>' \
              make ios-tests
      - run:
          name: Run Smoke Tests
          command: make smoke-bats
      - store_artifacts:
          path: smoke-tests/collector/data.json

  all_legs_passed:
    docker:
      - image: cimg/base:stable
    resource_class: small
    steps:
      - run: echo "All required legs passed."

workflows:
  nightly:
    triggers:
      - schedule:
          cron: "0 0 * * *"
          filters:
            branches:
              only:
                - main
    jobs:
      - lint
      - build:
          matrix:
            parameters:
              xcode_version:
                - "26.6"
                # Beta image. See the CAUTION note below.
                - "27.0.0"
              destination:
                - generic/platform=macOS
                - generic/platform=iOS
                - generic/platform=tvOS
                - generic/platform=watchOS
      - ios_tests:
          name: tests-ios-18
          xcode_version: "26.6"
          ios_version: "18.6"
          simulator_device: "iPhone 16"
      - ios_tests:
          name: tests-ios-26
          xcode_version: "26.6"
          ios_version: "26.5"
          simulator_device: "iPhone 17"
      - ios_tests:
          name: tests-ios-27-preview
          xcode_version: "27.0.0"
          ios_version: "27.0"
          simulator_device: "iPhone 17"
      - ios_smoke_tests:
          name: smoke-tests-ios-18
          otel_version: "2.0.2"
          xcode_version: "26.6"
          ios_version: "18.6"
          simulator_device: "iPhone 16"
      - ios_smoke_tests:
          name: smoke-tests-ios-26
          otel_version: "2.0.2"
          xcode_version: "26.6"
          ios_version: "26.5"
          simulator_device: "iPhone 17"
      - ios_smoke_tests:
          name: smoke-tests-ios-27-preview
          otel_version: "2.0.2"
          xcode_version: "27.0.0"
          ios_version: "27.0"
          simulator_device: "iPhone 17"
      - all_legs_passed:
          name: tests
          requires:
            - tests-ios-18
            - tests-ios-26
            - tests-ios-27-preview
      - all_legs_passed:
          name: smoke_tests-2.0.2
          requires:
            - smoke-tests-ios-18
            - smoke-tests-ios-26
            - smoke-tests-ios-27-preview

  build:
    jobs:
      - lint:
          <<: *filters_always
      - build:
          <<: *filters_always
          matrix:
            parameters:
              xcode_version:
                - "26.6"
                # Beta image. See the CAUTION note below.
                - "27.0.0"
              destination:
                - generic/platform=macOS
                - generic/platform=iOS
                - generic/platform=tvOS
                - generic/platform=watchOS
      - ios_tests:
          name: tests-ios-18
          <<: *filters_always
          xcode_version: "26.6"
          ios_version: "18.6"
          simulator_device: "iPhone 16"
      - ios_tests:
          name: tests-ios-26
          <<: *filters_always
          xcode_version: "26.6"
          ios_version: "26.5"
          simulator_device: "iPhone 17"
      # CAUTION: `xcode: 27.0.0` is a *beta* image.
      # Switch to the Xcode 27 GA version string once it ships.
      - ios_tests:
          name: tests-ios-27-preview
          <<: *filters_always
          xcode_version: "27.0.0"
          ios_version: "27.0"
          simulator_device: "iPhone 17"
      - ios_smoke_tests:
          name: smoke-tests-ios-18
          <<: *filters_always
          otel_version: "2.0.2"
          xcode_version: "26.6"
          ios_version: "18.6"
          simulator_device: "iPhone 16"
      - ios_smoke_tests:
          name: smoke-tests-ios-26
          <<: *filters_always
          otel_version: "2.0.2"
          xcode_version: "26.6"
          ios_version: "26.5"
          simulator_device: "iPhone 17"
      - ios_smoke_tests:
          name: smoke-tests-ios-27-preview
          <<: *filters_always
          otel_version: "2.0.2"
          xcode_version: "27.0.0"
          ios_version: "27.0"
          simulator_device: "iPhone 17"
      - all_legs_passed:
          name: tests
          <<: *filters_always
          requires:
            - tests-ios-18
            - tests-ios-26
            - tests-ios-27-preview
      - all_legs_passed:
          name: smoke_tests-2.0.2
          <<: *filters_always
          requires:
            - smoke-tests-ios-18
            - smoke-tests-ios-26
            - smoke-tests-ios-27-preview
